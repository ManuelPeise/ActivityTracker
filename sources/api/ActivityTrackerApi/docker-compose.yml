services:
  mysql:
    image: mysql:8.0
    container_name: activitytracker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "RootPassword123"
      MYSQL_DATABASE: "ActivityTrackerDb"
      MYSQL_USER: "DevUser"
      MYSQL_PASSWORD: "DevPassword123"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - activitytracker-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Core.Api/Dockerfile
    container_name: activitytracker-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ActivityTrackerDb: "Server=mysql;Port=3306;Database=ActivityTrackerDb;User=DevUser;Password=DevPassword123;"
    ports:
      - "5000:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - activitytracker-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  activitytracker-network:
    driver: bridge
